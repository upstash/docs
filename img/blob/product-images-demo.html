<!--
  Source for product-images-light.gif / product-images-dark.gif.
  window.seek(ms) sets the frame; ?theme=dark for the dark variant. DURATION is 9600ms.
  Record: playwright-core screenshots at 20fps (600x380, DPR 2), then
  ffmpeg -framerate 20 -i %04d.png -vf "scale=900:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" -loop 0 out.gif
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --ring: #10b981; --btn: #f3f4f6; --btn-text: #374151; --dlg: #ffffff; --dlg-shadow: rgba(0,0,0,.18);
    --bar: #e5e7eb; --danger: #dc2626; --sil: #d1d5db; --sil-bg: #eef0f3;
  }
  html[data-theme="dark"] {
    --bg: #0b0f14; --card: #131920; --border: #232b35; --text: #e5e7eb; --muted: #8b95a5;
    --ring: #34d399; --btn: #1c242e; --btn-text: #d1d5db; --dlg: #1a222c; --dlg-shadow: rgba(0,0,0,.6);
    --bar: #2a3441; --danger: #f87171; --sil: #3a4552; --sil-bg: #1c242e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 380px; overflow: hidden; background: var(--bg);
    font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #stage { position: relative; width: 600px; height: 380px; }
  .card { position: absolute; left: 72px; top: 56px; width: 456px; height: 268px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 24px 26px; }
  .card h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .card p.sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .label { font-size: 13px; font-weight: 500; margin-top: 22px; }
  .grid { position: relative; height: 92px; margin-top: 10px; }
  .slot { position: absolute; top: 0; width: 70px; }
  .tile { position: relative; width: 70px; height: 70px; border-radius: 9px; overflow: hidden; background: var(--sil-bg);
    box-shadow: 0 0 0 0px var(--ring); }
  .tile .photo { position: absolute; inset: 0; }
  .tile .bar { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 4px; border-radius: 2px; background: var(--bar); overflow: hidden; }
  .tile .bar i { display: block; height: 100%; width: 0; background: var(--ring); border-radius: 2px; }
  .tile .pct { position: absolute; left: 0; right: 0; top: 24px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { margin-top: 6px; font-size: 10.5px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; }
  .x { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; opacity: 0; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .x svg { width: 8px; height: 8px; stroke: var(--btn-text); }
  .x.hot { border-color: var(--danger); } .x.hot svg { stroke: var(--danger); }
  .x.press { transform: scale(.9); }
  .add { width: 70px; height: 70px; border-radius: 9px; border: 1.5px dashed var(--sil); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 10.5px; }
  .add svg { width: 16px; height: 16px; stroke: var(--muted); }
  .add.press { transform: scale(.96); }

  .photo { position: relative; overflow: hidden; }
  .a0 { background: linear-gradient(160deg, #fde68a, #f59e0b); }
  .a0::after { content: ""; position: absolute; left: 30%; top: 18%; width: 40%; height: 64%; border-radius: 12px 12px 8px 8px; background: #7c2d12; }
  .a1 { background: linear-gradient(135deg, #a5b4fc, #60a5fa); }
  .a1::after { content: ""; position: absolute; left: 22%; top: 30%; width: 56%; height: 40%; border-radius: 40px 40px 6px 6px; background: #1e3a8a; }
  .a2 { background: linear-gradient(135deg, #86efac, #14b8a6); }
  .a2::after { content: ""; position: absolute; left: 28%; top: 24%; width: 44%; height: 44%; border-radius: 50%; background: #134e4a; }
  .a3 { background: linear-gradient(135deg, #fda4af, #f472b6); }
  .a3::after { content: ""; position: absolute; left: 20%; top: 40%; width: 60%; height: 34%; border-radius: 6px; background: #831843; transform: rotate(-8deg); }
  .a4 { background: linear-gradient(135deg, #c4b5fd, #8b5cf6); }
  .a4::after { content: ""; position: absolute; left: 34%; top: 14%; width: 32%; height: 72%; border-radius: 16px; background: #3b0764; }

  .url { position: absolute; left: 26px; bottom: 20px; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); opacity: 0;
    display: flex; align-items: center; gap: 8px; }
  .url .chk { width: 14px; height: 14px; border-radius: 50%; background: var(--ring); display: inline-flex; align-items: center; justify-content: center; }
  .url .chk svg { width: 9px; height: 9px; }
  .url b { color: var(--text); font-weight: 600; }

  .dlg { position: absolute; left: 150px; top: 58px; width: 300px; background: var(--dlg); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 24px 60px var(--dlg-shadow); padding: 16px; opacity: 0; transform-origin: 50% 30%; }
  .dlg .t { font-size: 13px; font-weight: 600; text-align: center; }
  .dlg .dgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .dlg .th { aspect-ratio: 1; border-radius: 9px; overflow: hidden; position: relative; box-shadow: 0 0 0 0px var(--ring); }
  .dlg .th.sel { box-shadow: 0 0 0 2.5px var(--ring); }
  .dlg .th .photo { position: absolute; inset: 0; }
  .dlg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .dlg .b { font-size: 12.5px; padding: 7px 14px; border-radius: 8px; background: var(--btn); color: var(--btn-text); border: 1px solid var(--border); }
  .dlg .b.primary { background: var(--ring); color: #fff; border-color: transparent; font-weight: 600; }
  .dlg .b.press { transform: scale(.96); }

  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 26px; transform-origin: 4px 3px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="stage">
  <div class="card">
    <h1>Trail Runner</h1>
    <p class="sub">Product images, shown on the product page in this order.</p>
    <div class="label">Images</div>
    <div class="grid" id="grid">
      <div class="slot" id="s0">
        <div class="tile"><div class="photo a0"></div></div>
        <div class="name">hero.jpg</div>
      </div>
      <div class="slot" id="s1">
        <div class="tile" id="t1"><div class="photo a1" id="p1"></div><div class="pct" id="c1">0%</div><div class="bar" id="b1"><i id="f1"></i></div></div>
        <div class="name">front.jpg</div>
      </div>
      <div class="slot" id="s2">
        <div class="tile" id="t2"><div class="photo a2" id="p2"></div><div class="pct" id="c2">0%</div><div class="bar" id="b2"><i id="f2"></i></div></div>
        <div class="x" id="x2"><svg viewBox="0 0 10 10" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></div>
        <div class="name">side.jpg</div>
      </div>
      <div class="slot" id="s3">
        <div class="tile" id="t3"><div class="photo a3" id="p3"></div><div class="pct" id="c3">0%</div><div class="bar" id="b3"><i id="f3"></i></div></div>
        <div class="name">detail.jpg</div>
      </div>
      <div class="slot" id="s4">
        <div class="add" id="add"><svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>Add</div>
      </div>
    </div>
    <div class="url" id="url"><span class="chk"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><path d="M1.5 5.5l2.3 2.2L8.5 2.5"/></svg></span><span>3 images saved to products/<b>p_18</b>/</span></div>
  </div>

  <div class="dlg" id="dlg">
    <div class="t">Choose images</div>
    <div class="dgrid">
      <div class="th" id="th1"><div class="photo a1"></div></div>
      <div class="th" id="th2"><div class="photo a2"></div></div>
      <div class="th" id="th3"><div class="photo a3"></div></div>
      <div class="th"><div class="photo a4"></div></div>
    </div>
    <div class="foot"><div class="b">Cancel</div><div class="b primary" id="open">Open</div></div>
  </div>

  <svg id="cursor" viewBox="0 0 22 26"><path d="M3 2 L3 20 L7.6 15.6 L10.8 23 L14 21.6 L10.9 14.4 L17.5 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const $ = id => document.getElementById(id);
  const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
  const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  const easeOut = x => 1 - Math.pow(1-x, 3);
  const seg = (t, a, b, fn=ease) => fn(clamp((t-a)/(b-a)));
  const lerp = (a, b, x) => a + (b-a)*x;
  // click flash: 1 at moment, decays over 220ms
  const click = (t, at) => t < at ? 0 : 1 - clamp((t-at)/220);

  // slots: 70px tiles on an 80px pitch. The add tile lives in slot 4 and is translated back to slot 1 until the uploads land.
  const PITCH = 80;
  for (let i = 0; i < 5; i++) $('s' + i).style.left = (i * PITCH) + 'px';
  $('s4').style.transform = `translateX(${-3 * PITCH}px)`;

  // positions (stage coords, cursor hotspot), measured from the initial layout
  const c = id => { const r = $(id).getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
  const P = { start:[470,345], add:c('add'), th1:c('th1'), th2:c('th2'), th3:c('th3'), open:c('open'),
    rest:[430, 300], t2:c('t2'), x2:c('x2') };
  // cursor path: list of [tFrom, tTo, from, to]
  const path = [
    [500, 1200, P.start, P.add],
    [1750, 2250, P.add, P.th1],
    [2450, 2750, P.th1, P.th2],
    [2950, 3250, P.th2, P.th3],
    [3450, 3850, P.th3, P.open],
    [4200, 4800, P.open, P.rest],
    [6800, 7400, P.rest, P.t2],
    [7700, 8000, P.t2, P.x2],
  ];
  function cursorAt(t) {
    let pos = P.start;
    for (const [a, b, f, to] of path) {
      if (t < a) break;
      const x = seg(t, a, b);
      pos = [lerp(f[0], to[0], x), lerp(f[1], to[1], x)];
    }
    return pos;
  }

  const T = {
    addClick: 1250, dlgIn: 1450, sel1: 2300, sel2: 2800, sel3: 3300, openClick: 3900, dlgOut: 4050,
    land: 4250, up: 4450, xHover: 7400, xClick: 8050, gone: 8100,
  };
  // per-upload finish times, in parallel at different speeds
  const DONE = { 1: 5800, 2: 6500, 3: 6150 };

  window.seek = function(t) {
    const [cx, cy] = cursorAt(t);
    const press = Math.max(click(t,T.addClick), click(t,T.sel1), click(t,T.sel2), click(t,T.sel3), click(t,T.openClick), click(t,T.xClick));
    $('cursor').style.transform = `translate(${cx-3}px, ${cy-2}px) scale(${1 - .12*press})`;

    // add tile click
    $('add').className = 'add' + (click(t, T.addClick) > .3 ? ' press' : '');

    // dialog
    const dOpen = seg(t, T.dlgIn, T.dlgIn + 250, easeOut), dClose = seg(t, T.dlgOut, T.dlgOut + 150);
    $('dlg').style.opacity = dOpen * (1 - dClose);
    $('dlg').style.transform = `scale(${lerp(.94, 1, dOpen)})`;
    const inDlg = t < T.dlgOut + 150;
    $('th1').className = 'th' + (t >= T.sel1 && inDlg ? ' sel' : '');
    $('th2').className = 'th' + (t >= T.sel2 && inDlg ? ' sel' : '');
    $('th3').className = 'th' + (t >= T.sel3 && inDlg ? ' sel' : '');
    $('open').className = 'b primary' + (click(t, T.openClick) > .3 ? ' press' : '');

    // add tile slides from slot 1 to slot 4 as the three new tiles land
    const slide = seg(t, T.dlgOut, T.dlgOut + 400);
    // after side.jpg is removed, detail.jpg and the add tile step left by one slot
    const collapse = seg(t, T.gone + 150, T.gone + 500);
    $('s4').style.transform = `translateX(${lerp(-3 * PITCH, 0, slide) - PITCH * collapse}px)`;
    $('s3').style.transform = `translateX(${-PITCH * collapse}px)`;

    // new tiles: appear, upload in parallel, then show the image
    for (const i of [1, 2, 3]) {
      const s = $('s' + i);
      const land = seg(t, T.land + (i - 1) * 80, T.land + (i - 1) * 80 + 250, easeOut);
      const up = seg(t, T.up, DONE[i]);
      const done = seg(t, DONE[i], DONE[i] + 300);
      let op = land, sc = lerp(.9, 1, land);
      if (i === 2) { const out = seg(t, T.gone, T.gone + 300); op *= 1 - out; sc *= lerp(1, .85, out); }
      s.style.opacity = op;
      s.style.transform = (i === 3 ? s.style.transform + ' ' : '') + `scale(${sc})`;
      $('f' + i).style.width = (up * 100) + '%';
      $('c' + i).textContent = Math.round(up * 100) + '%';
      $('b' + i).style.opacity = 1 - done; $('c' + i).style.opacity = 1 - done;
      $('p' + i).style.opacity = done;
    }

    // status line once the last upload lands
    const urlIn = seg(t, DONE[2] + 250, DONE[2] + 550), urlOut = seg(t, T.gone, T.gone + 250);
    $('url').style.opacity = urlIn * (1 - urlOut);

    // remove: hover side.jpg, the x appears, click it
    const hover = t >= T.xHover && t < T.gone;
    $('t2').style.boxShadow = `0 0 0 ${hover ? 2 : 0}px var(--ring)`;
    const xIn = seg(t, T.xHover, T.xHover + 200);
    $('x2').style.opacity = hover ? xIn : 0;
    const hot = t >= 7950 && t < T.gone;
    $('x2').className = 'x' + (hot ? ' hot' : '') + (click(t, T.xClick) > .3 ? ' press' : '');
  };
  window.DURATION = 9600;
  seek(0);
</script>
</body>
</html>
