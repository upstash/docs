<!--
  Source for product-images-light.gif / product-images-dark.gif.
  window.seek(ms) sets the frame; ?theme=dark for the dark variant. DURATION is 10200ms.
  Record: playwright-core screenshots at 20fps (600x380, DPR 2), then
  ffmpeg -framerate 20 -i %04d.png -vf "scale=900:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" -loop 0 out.gif
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --ring: #10b981; --btn: #f3f4f6; --btn-text: #374151; --dlg: #ffffff; --dlg-shadow: rgba(0,0,0,.18);
    --bar: #e5e7eb; --danger: #dc2626; --sil: #d1d5db; --sil-bg: #eef0f3; --chip-ok: #d1fae5; --chip-ok-text: #047857; --rail: #111827;
  }
  html[data-theme="dark"] {
    --bg: #0b0f14; --card: #131920; --border: #232b35; --text: #e5e7eb; --muted: #8b95a5;
    --ring: #34d399; --btn: #1c242e; --btn-text: #d1d5db; --dlg: #1a222c; --dlg-shadow: rgba(0,0,0,.6);
    --bar: #2a3441; --danger: #f87171; --sil: #3a4552; --sil-bg: #1c242e; --chip-ok: #064e3b; --chip-ok-text: #6ee7b7; --rail: #0b0f14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 380px; overflow: hidden; background: var(--bg);
    font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #stage { position: relative; width: 600px; height: 380px; }
  .panel { position: absolute; top: 40px; height: 300px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tag { position: absolute; top: -18px; left: 2px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  /* admin */
  .admin { left: 16px; width: 322px; display: flex; }
  .rail { width: 40px; background: var(--rail); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 10px; flex: none; }
  .rail i { display: block; width: 16px; height: 16px; border-radius: 5px; background: rgba(255,255,255,.14); }
  .rail i.on { background: var(--ring); }
  .rail i:first-child { border-radius: 50%; background: var(--ring); width: 18px; height: 18px; margin-bottom: 6px; }
  .main { flex: 1; padding: 14px 14px; position: relative; }
  .crumb { font-size: 10.5px; color: var(--muted); }
  .ttl { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .ttl h1 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .chip { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--chip-ok); color: var(--chip-ok-text); }
  .field { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .field .l { font-size: 12px; font-weight: 500; }
  .field .n { font-size: 11px; color: var(--muted); }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tile { position: relative; width: 50px; height: 50px; border-radius: 8px; overflow: hidden; background: var(--sil-bg); flex: none; }
  .tile .ph { position: absolute; inset: 0; }
  .tile .veil { position: absolute; inset: 0; background: var(--card); opacity: .72; }
  .tile .pb { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 4px; border-radius: 2px; background: var(--bar); overflow: hidden; }
  .tile .pb i { display: block; height: 100%; width: 0; background: var(--ring); }
  .tile .pc { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .tile .x { position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: rgba(17,24,39,.85); opacity: 0; }
  .tile .x::before, .tile .x::after { content: ""; position: absolute; left: 7px; top: 4px; width: 2px; height: 8px; background: #fff; border-radius: 1px; }
  .tile .x::before { transform: rotate(45deg); } .tile .x::after { transform: rotate(-45deg); }
  .tile.add { border: 1.5px dashed var(--border); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 10.5px; }
  .tile.add .plus { font-size: 16px; line-height: 1; }
  .tile.add.press { transform: scale(.95); }
  .status { position: absolute; left: 14px; bottom: 12px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ring); }
  .status code { font: 10.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }

  /* storefront */
  .shop { left: 352px; width: 232px; }
  .chrome { height: 24px; background: var(--btn); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 8px; gap: 4px; }
  .chrome i { width: 6px; height: 6px; border-radius: 50%; background: var(--sil); }
  .chrome .url { margin-left: 6px; flex: 1; height: 14px; border-radius: 4px; background: var(--card); font-size: 8.5px; color: var(--muted); display: flex; align-items: center; padding: 0 6px; }
  .hero { margin: 10px 12px 0; height: 118px; border-radius: 8px; overflow: hidden; position: relative; background: var(--sil-bg); }
  .thumbs { display: flex; gap: 6px; margin: 8px 12px 0; }
  .thumb { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; position: relative; flex: none; background: var(--sil-bg); box-shadow: 0 0 0 0px var(--ring); }
  .thumb.on { box-shadow: 0 0 0 2px var(--ring); }
  .pname { margin: 10px 12px 0; font-size: 12.5px; font-weight: 600; }
  .price { margin: 2px 12px 0; font-size: 11.5px; color: var(--muted); }
  .cart { margin: 10px 12px 0; height: 26px; border-radius: 7px; background: var(--rail); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  html[data-theme="dark"] .cart { background: var(--ring); color: #062a1f; }

  /* product photos: a desk lamp on a coloured backdrop */
  .ph { position: absolute; inset: 0; overflow: hidden; }
  .ph .lamp { position: absolute; left: 50%; top: 50%; width: 60%; height: 70%; transform: translate(-50%, -50%); }
  .ph .dome { position: absolute; left: 25%; top: 6%; width: 50%; height: 28%; background: #3f2a1d; border-radius: 100% 100% 8% 8% / 100% 100% 12% 12%; }
  .ph .glow { position: absolute; left: 30%; top: 32%; width: 40%; height: 14%; border-radius: 50%; background: #ffe9a8; filter: blur(3px); opacity: .9; }
  .ph .stem { position: absolute; left: 48%; top: 30%; width: 4%; height: 54%; background: #3f2a1d; }
  .ph .base { position: absolute; left: 22%; top: 82%; width: 56%; height: 8%; background: #3f2a1d; border-radius: 999px; }
  .p1 { background: linear-gradient(160deg, #fde7c3, #f4c58f); }
  .p2 { background: linear-gradient(160deg, #dbe8dc, #a9c5ad); }
  .p2 .lamp { transform: translate(-50%, -50%) rotate(-14deg); }
  .p3 { background: linear-gradient(160deg, #d9e2f2, #a8b8d8); }
  .p3 .lamp { transform: translate(-50%, -30%) scale(1.7); }
  .p4 { background: linear-gradient(160deg, #f6d9d9, #e3a9a9); }
  .p4 .lamp { transform: translate(-50%, -50%) scaleX(-1); }

  .dlg { position: absolute; left: 150px; top: 88px; width: 300px; background: var(--dlg); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 24px 60px var(--dlg-shadow); padding: 16px; opacity: 0; transform-origin: 50% 30%; }
  .dlg .t { font-size: 13px; font-weight: 600; text-align: center; }
  .dlg .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .dlg .th { aspect-ratio: 1; border-radius: 9px; overflow: hidden; position: relative; box-shadow: 0 0 0 0px var(--ring); }
  .dlg .th.sel { box-shadow: 0 0 0 2.5px var(--ring); }
  .dlg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .dlg .b { font-size: 12.5px; padding: 7px 14px; border-radius: 8px; background: var(--btn); color: var(--btn-text); border: 1px solid var(--border); }
  .dlg .b.primary { background: var(--ring); color: #fff; border-color: transparent; font-weight: 600; }
  .dlg .b.press { transform: scale(.96); }

  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 26px; transform-origin: 4px 3px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="stage">
  <div class="panel admin">
    <div class="tag">Admin</div>
    <div class="rail"><i></i><i></i><i class="on"></i><i></i><i></i></div>
    <div class="main">
      <div class="crumb">Catalog / Products / Lighting</div>
      <div class="ttl"><h1>Oak Desk Lamp</h1><span class="chip">Published</span></div>
      <div class="field"><span class="l">Images</span><span class="n" id="count">1 image</span></div>
      <div class="grid" id="grid">
        <div class="tile"><div class="ph p1"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
        <div class="tile up" id="u1"><div class="ph p2"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div><div class="veil"></div><div class="pc">0%</div><div class="pb"><i></i></div><div class="x"></div></div>
        <div class="tile up" id="u2"><div class="ph p3"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div><div class="veil"></div><div class="pc">0%</div><div class="pb"><i></i></div><div class="x"></div></div>
        <div class="tile up" id="u3"><div class="ph p4"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div><div class="veil"></div><div class="pc">0%</div><div class="pb"><i></i></div><div class="x" id="x3"></div></div>
        <div class="tile add" id="add"><span class="plus">+</span>Add</div>
      </div>
      <div class="status" id="status"><span class="dot" id="dot"></span><span id="stxt">Live on the product page</span></div>
    </div>
  </div>

  <div class="panel shop">
    <div class="tag">Product page</div>
    <div class="chrome"><i></i><i></i><i></i><div class="url">shop.example.com/p/oak-desk-lamp</div></div>
    <div class="hero"><div class="ph p1"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
    <div class="thumbs">
      <div class="thumb on"><div class="ph p1"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
      <div class="thumb" id="s1"><div class="ph p2"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
      <div class="thumb" id="s2"><div class="ph p3"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
      <div class="thumb" id="s3"><div class="ph p4"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
    </div>
    <div class="pname">Oak Desk Lamp</div>
    <div class="price">$89.00 · In stock</div>
    <div class="cart">Add to cart</div>
  </div>

  <div class="dlg" id="dlg">
    <div class="t">Choose images</div>
    <div class="row">
      <div class="th" id="d1"><div class="ph p2"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
      <div class="th" id="d2"><div class="ph p3"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
      <div class="th" id="d3"><div class="ph p4"><div class="lamp"><div class="dome"></div><div class="glow"></div><div class="stem"></div><div class="base"></div></div></div></div>
      <div class="th"><div class="ph" style="background:linear-gradient(135deg,#c7d2fe,#93c5fd)"></div></div>
    </div>
    <div class="foot"><div class="b">Cancel</div><div class="b primary" id="open">Open</div></div>
  </div>

  <svg id="cursor" viewBox="0 0 22 26"><path d="M3 2 L3 20 L7.6 15.6 L10.8 23 L14 21.6 L10.9 14.4 L17.5 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const $ = id => document.getElementById(id);
  const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
  const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  const easeOut = x => 1 - Math.pow(1-x, 3);
  const lin = x => x;
  const seg = (t, a, b, fn=ease) => fn(clamp((t-a)/(b-a)));
  const lerp = (a, b, x) => a + (b-a)*x;
  const click = (t, at) => t < at ? 0 : 1 - clamp((t-at)/220);

  const ups = ['u1','u2','u3'].map($), shopThumbs = ['s1','s2','s3'].map($);
  const setTile = (el, w, o) => { el.style.width = w + 'px'; el.style.marginRight = (w < 50 ? -6 + (6 * w / 50) : 0) + 'px'; el.style.opacity = o; };

  // measure cursor targets: Add with the upload tiles collapsed, the x badge with them expanded
  const c = id => { const r = $(id).getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
  ups.forEach(el => setTile(el, 0, 0));
  const P = { start:[470,350], add:c('add'), d1:c('d1'), d2:c('d2'), d3:c('d3'), open:c('open'), rest:[300, 355] };
  ups.forEach(el => setTile(el, 50, 1));
  P.x3 = c('x3');
  P.tile3 = c('u3');
  ups.forEach(el => setTile(el, 0, 0));

  // timeline (ms)
  const T = { add:1450, s1:2350, s2:2850, s3:3350, open:4000, land:4250, u0:4300, done:[5600, 6150, 6700], hover:7900, del:8250, gone:8350 };
  const path = [
    [700, 1400, P.start, P.add],
    [1900, 2300, P.add, P.d1],
    [2500, 2800, P.d1, P.d2],
    [3000, 3300, P.d2, P.d3],
    [3550, 3950, P.d3, P.open],
    [4300, 4900, P.open, P.rest],
    [7300, 7900, P.rest, P.tile3],
    [7950, 8200, P.tile3, P.x3],
    [8700, 9200, P.x3, P.rest],
  ];
  function cursorAt(t) {
    let pos = P.start;
    for (const [a, b, f, to] of path) {
      if (t < a) break;
      const x = seg(t, a, b);
      pos = [lerp(f[0], to[0], x), lerp(f[1], to[1], x)];
    }
    return pos;
  }

  window.seek = function(t) {
    const [cx, cy] = cursorAt(t);
    const press = Math.max(click(t,T.add), click(t,T.s1), click(t,T.s2), click(t,T.s3), click(t,T.open), click(t,T.del));
    $('cursor').style.transform = `translate(${cx-3}px, ${cy-2}px) scale(${1 - .12*press})`;
    $('add').className = 'tile add' + (click(t, T.add) > .3 ? ' press' : '');

    // dialog
    const dO = seg(t, 1650, 1900, easeOut) * (1 - seg(t, 4050, 4200));
    $('dlg').style.opacity = dO;
    $('dlg').style.transform = `scale(${lerp(.94, 1, dO)})`;
    const inD = t < 4200;
    $('d1').className = 'th' + (t >= T.s1 && inD ? ' sel' : '');
    $('d2').className = 'th' + (t >= T.s2 && inD ? ' sel' : '');
    $('d3').className = 'th' + (t >= T.s3 && inD ? ' sel' : '');
    $('open').className = 'b primary' + (click(t, T.open) > .3 ? ' press' : '');

    // tiles land, upload in parallel at different speeds, then the third is removed
    const land = seg(t, T.land, T.land + 250, easeOut);
    const gone = seg(t, T.gone, T.gone + 300);
    let doneCount = 0, uploading = 0;
    ups.forEach((el, i) => {
      const w = i === 2 ? lerp(50, 0, gone) * land : 50 * land;
      setTile(el, w, i === 2 ? land * (1 - gone) : land);
      const p = seg(t, T.u0, T.done[i], lin);
      const fin = t >= T.done[i];
      if (fin) doneCount++; else if (t >= T.u0) uploading++;
      const settle = seg(t, T.done[i], T.done[i] + 250);
      el.querySelector('.veil').style.opacity = .72 * (1 - settle);
      el.querySelector('.pb').style.opacity = 1 - settle;
      el.querySelector('.pc').style.opacity = 1 - settle;
      el.querySelector('.pb i').style.width = (p * 100) + '%';
      el.querySelector('.pc').textContent = Math.round(p * 100) + '%';
      // the product page shows each image the moment its row is written
      const s = shopThumbs[i];
      const sIn = seg(t, T.done[i] + 100, T.done[i] + 400, easeOut);
      const sw = i === 2 ? lerp(36, 0, gone) * sIn : 36 * sIn;
      s.style.width = sw + 'px'; s.style.marginRight = (sw < 36 ? -6 + 6 * sw / 36 : 0) + 'px';
      s.style.opacity = i === 2 ? sIn * (1 - gone) : sIn;
    });
    $('x3').style.opacity = seg(t, T.hover, T.hover + 150) * (1 - gone);
    $('x3').style.transform = click(t, T.del) > .3 ? 'scale(.85)' : 'none';

    const total = 1 + doneCount - (t >= T.gone ? 1 : 0);
    $('count').textContent = uploading ? `${uploading} uploading` : `${total} image${total === 1 ? '' : 's'}`;
    $('stxt').textContent = uploading ? `Uploading to products/p_204/` : t >= T.gone ? 'Row deleted, then the object' : 'Live on the product page';
    $('dot').style.background = uploading ? 'var(--muted)' : 'var(--ring)';
  };
  window.DURATION = 10200;
  seek(0);
</script>
</body>
</html>
