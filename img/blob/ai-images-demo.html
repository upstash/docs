<!--
  Source for ai-images-light.gif / ai-images-dark.gif.
  window.seek(ms) sets the frame; ?theme=dark for the dark variant. DURATION is 9000ms.
  Record: playwright-core screenshots at 20fps (600x380, DPR 2), then
  ffmpeg -framerate 20 -i %04d.png -vf "scale=900:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" -loop 0 out.gif
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --ring: #10b981; --btn: #f3f4f6; --btn-text: #374151; --dlg: #ffffff; --dlg-shadow: rgba(0,0,0,.18);
    --bar: #e5e7eb; --danger: #dc2626; --sil: #d1d5db; --sil-bg: #eef0f3; --input: #ffffff;
  }
  html[data-theme="dark"] {
    --bg: #0b0f14; --card: #131920; --border: #232b35; --text: #e5e7eb; --muted: #8b95a5;
    --ring: #34d399; --btn: #1c242e; --btn-text: #d1d5db; --dlg: #1a222c; --dlg-shadow: rgba(0,0,0,.6);
    --bar: #2a3441; --danger: #f87171; --sil: #3a4552; --sil-bg: #1c242e; --input: #0f151c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 380px; overflow: hidden; background: var(--bg);
    font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #stage { position: relative; width: 600px; height: 380px; }
  .card { position: absolute; left: 80px; top: 58px; width: 440px; height: 264px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; }
  .card h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .card p.sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .form { display: flex; gap: 10px; margin-top: 14px; }
  .input { flex: 1; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--input);
    padding: 0 10px; display: flex; align-items: center; font-size: 12.5px; box-shadow: 0 0 0 0px var(--ring); position: relative; }
  .input .ph { color: var(--muted); position: absolute; left: 10px; top: 8px; }
  .input .val { color: var(--text); white-space: pre; }
  .input .caret { display: inline-block; width: 1px; height: 14px; background: var(--text); margin-left: 1px; vertical-align: -2px; }
  .gen { height: 32px; padding: 0 14px; border-radius: 8px; background: var(--ring); color: #fff; font-size: 12.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; flex: none; white-space: nowrap; }
  .gen.busy { opacity: .75; }
  .gen.press { transform: scale(.96); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; display: none; }
  .gen.busy .spin { display: block; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .tile { position: relative; }
  .tile .img { position: relative; height: 84px; border-radius: 9px; overflow: hidden; background: var(--sil-bg); border: 1px solid var(--border); }
  .tile .cap { font-size: 11px; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .cap.pending { font-style: italic; }
  .del { position: absolute; right: 6px; top: 6px; font-size: 10.5px; font-weight: 500; color: var(--danger); background: var(--dlg);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; opacity: 0; box-shadow: 0 2px 6px var(--dlg-shadow); }
  .del.press { transform: scale(.96); }

  /* CSS-only art */
  .fox { background: linear-gradient(180deg, #bfe3ff 0%, #d9f0ff 45%, #86c96a 46%, #4f9d3a 100%); }
  .fox .b { position: absolute; left: 30%; top: 40%; width: 40%; height: 30%; border-radius: 50% 50% 40% 40%; background: #e8752e; }
  .fox .h { position: absolute; left: 58%; top: 30%; width: 22%; height: 22%; border-radius: 50%; background: #f08a3e; }
  .fox .e { position: absolute; left: 60%; top: 22%; width: 7%; height: 12%; background: #f08a3e; clip-path: polygon(0 100%, 50% 0, 100% 100%); }
  .fox .e2 { left: 72%; }
  .fox .g { position: absolute; inset: auto 0 0 0; height: 32%; background: repeating-linear-gradient(100deg, transparent 0 6px, rgba(30,90,20,.35) 6px 8px); }
  .city { background: linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #334155 100%); }
  .city .m { position: absolute; left: 70%; top: 14%; width: 16%; height: 16%; border-radius: 50%; background: #fde68a; box-shadow: 0 0 12px #fde68a; }
  .city .s { position: absolute; bottom: 0; background: #0b1220; }
  .city .s1 { left: 6%; width: 14%; height: 55%; }
  .city .s2 { left: 24%; width: 18%; height: 72%; }
  .city .s3 { left: 46%; width: 12%; height: 48%; }
  .city .s4 { left: 62%; width: 20%; height: 62%; }
  .city .s5 { left: 86%; width: 10%; height: 40%; }
  .city .w { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(253,230,138,.5) 5px 7px), repeating-linear-gradient(90deg, transparent 0 4px, rgba(0,0,0,.6) 4px 6px); opacity: .35; }
  .light { background: linear-gradient(180deg, #ffd08a 0%, #ff8a5b 45%, #6a4c93 100%); }
  .light .sun { position: absolute; width: 26%; height: 30%; border-radius: 50%; background: #fff3c4; left: 20%; top: 20%; box-shadow: 0 0 16px #ffe08a; }
  .light .sea { position: absolute; inset: auto 0 0 0; height: 34%; background: linear-gradient(180deg, #3b3f8f, #24245c); }
  .light .rock { position: absolute; left: 52%; bottom: 26%; width: 34%; height: 14%; border-radius: 50% 50% 0 0; background: #2a1f45; }
  .light .tw { position: absolute; left: 65%; bottom: 36%; width: 9%; height: 42%; background: linear-gradient(90deg, #f8fafc, #cbd5e1); clip-path: polygon(15% 100%, 30% 0, 70% 0, 85% 100%); }
  .light .top { position: absolute; left: 64%; bottom: 76%; width: 11%; height: 8%; background: #dc2626; border-radius: 2px 2px 0 0; }
  .light .beam { position: absolute; left: 69%; bottom: 78%; width: 40%; height: 10%; background: linear-gradient(90deg, rgba(255,243,196,.8), transparent); clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%); }

  .art { position: absolute; inset: 0; opacity: 0; }
  .shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, var(--sil-bg) 30%, var(--bar) 50%, var(--sil-bg) 70%); background-size: 300% 100%; opacity: 0; }
  .wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .wait .ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bar); border-top-color: var(--ring); }

  .url { position: absolute; left: 24px; bottom: 16px; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); opacity: 0;
    display: flex; align-items: center; gap: 8px; }
  .url .chk { width: 14px; height: 14px; border-radius: 50%; background: var(--ring); display: inline-flex; align-items: center; justify-content: center; }
  .url .chk svg { width: 9px; height: 9px; }
  .url b { color: var(--text); font-weight: 600; }

  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 26px; transform-origin: 4px 3px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="stage">
  <div class="card">
    <h1>Generate</h1>
    <p class="sub">Describe an image. It is kept in your gallery.</p>
    <div class="form">
      <div class="input" id="input"><span class="ph" id="ph">Describe an image</span><span class="val" id="val"></span><span class="caret" id="caret"></span></div>
      <div class="gen" id="gen"><span class="spin" id="spin"></span><span id="genlabel">Generate</span></div>
    </div>
    <div class="grid">
      <div class="tile">
        <div class="img fox"><div class="g"></div><div class="b"></div><div class="e"></div><div class="e e2"></div><div class="h"></div></div>
        <div class="cap">a fox in tall grass</div>
      </div>
      <div class="tile">
        <div class="img city"><div class="m"></div><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div><div class="s s4"></div><div class="s s5"></div><div class="w"></div></div>
        <div class="cap">city skyline at night</div>
      </div>
      <div class="tile" id="tile3">
        <div class="img" id="img3">
          <div class="shimmer" id="shimmer"></div>
          <div class="wait" id="wait"><div class="ring" id="ring"></div></div>
          <div class="art light" id="art"><div class="sun"></div><div class="sea"></div><div class="rock"></div><div class="beam"></div><div class="tw"></div><div class="top"></div></div>
          <div class="del" id="del">Delete</div>
        </div>
        <div class="cap" id="cap3"></div>
      </div>
    </div>
    <div class="url" id="url"><span class="chk"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><path d="M1.5 5.5l2.3 2.2L8.5 2.5"/></svg></span><span>generations/<b>u_42</b>/3f9a1c</span></div>
  </div>

  <svg id="cursor" viewBox="0 0 22 26"><path d="M3 2 L3 20 L7.6 15.6 L10.8 23 L14 21.6 L10.9 14.4 L17.5 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const $ = id => document.getElementById(id);
  const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
  const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  const easeOut = x => 1 - Math.pow(1-x, 3);
  const seg = (t, a, b, fn=ease) => fn(clamp((t-a)/(b-a)));
  const lerp = (a, b, x) => a + (b-a)*x;
  // click flash: 1 at moment, decays over 220ms
  const click = (t, at) => t < at ? 0 : 1 - clamp((t-at)/220);

  const PROMPT = 'a lighthouse at dusk';

  // positions (stage coords, cursor hotspot), measured so nothing is hardcoded
  const c = id => { const r = $(id).getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
  const P = { start:[470,340], input:(() => { const [x, y] = c('input'); return [x - 60, y]; })(), gen:c('gen'), del:c('del') };
  // cursor path: list of [tFrom, tTo, from, to]
  const path = [
    [500, 1100, P.start, P.input],
    [2800, 3400, P.input, P.gen],
    [6600, 7400, P.gen, P.del],
  ];
  function cursorAt(t) {
    let pos = P.start;
    for (const [a, b, f, to] of path) {
      if (t < a) break;
      const x = seg(t, a, b);
      pos = [lerp(f[0], to[0], x), lerp(f[1], to[1], x)];
    }
    return pos;
  }

  const T = { focus: 1150, typeA: 1300, typeB: 2600, gen: 3450, done: 5700, del: 7500 };

  window.seek = function(t) {
    const [cx, cy] = cursorAt(t);
    const press = Math.max(click(t, T.focus), click(t, T.gen), click(t, T.del));
    $('cursor').style.transform = `translate(${cx-3}px, ${cy-2}px) scale(${1 - .12*press})`;

    // input focus + typing
    const focused = t >= T.focus && t < T.gen;
    $('input').style.boxShadow = `0 0 0 ${focused ? 2 : 0}px var(--ring)`;
    const n = t < T.typeA ? 0 : t >= T.done ? 0 : Math.round(seg(t, T.typeA, T.typeB, x => x) * PROMPT.length);
    $('val').textContent = PROMPT.slice(0, n);
    $('ph').style.opacity = n === 0 ? 1 : 0;
    $('caret').style.opacity = focused && Math.floor(t / 500) % 2 === 0 ? 1 : 0;

    // generate button
    const busy = t >= T.gen && t < T.done;
    $('gen').className = 'gen' + (busy ? ' busy' : '') + (click(t, T.gen) > .3 ? ' press' : '');
    $('genlabel').textContent = busy ? 'Generating...' : 'Generate';
    $('spin').style.transform = `rotate(${(t / 900) * 360}deg)`;

    // in-flight tile, then the image
    const waitIn = seg(t, T.gen + 50, T.gen + 300, easeOut), imgIn = seg(t, T.done, T.done + 400);
    const gone = seg(t, T.del + 100, T.del + 450);
    $('shimmer').style.opacity = waitIn * (1 - imgIn);
    $('shimmer').style.backgroundPosition = `${100 - ((t / 1400) % 1) * 200}% 0`;
    $('wait').style.opacity = waitIn * (1 - imgIn);
    $('ring').style.transform = `rotate(${(t / 900) * 360}deg)`;
    $('art').style.opacity = imgIn * (1 - gone);
    $('tile3').style.opacity = t < T.gen ? 0 : 1 - gone;
    $('tile3').style.transform = `scale(${1 - .06*gone})`;
    $('img3').style.borderColor = imgIn > 0 && gone < 1 ? 'transparent' : '';
    const capWait = waitIn > 0 && t < T.done;
    $('cap3').textContent = capWait ? 'Generating...' : imgIn > 0 ? PROMPT : '';
    $('cap3').className = 'cap' + (capWait ? ' pending' : '');
    $('cap3').style.opacity = capWait ? .8 : (imgIn * (1 - gone));

    // url line
    const urlIn = seg(t, T.done + 250, T.done + 550), urlOut = seg(t, T.del + 100, T.del + 350);
    $('url').style.opacity = urlIn * (1 - urlOut);

    // delete pill on hover, then press
    const hover = seg(t, 7150, 7350) * (1 - seg(t, T.del + 100, T.del + 300));
    $('del').style.opacity = hover;
    $('del').className = 'del' + (click(t, T.del) > .3 ? ' press' : '');
  };
  window.DURATION = 9000;
  seek(0);
</script>
</body>
</html>
