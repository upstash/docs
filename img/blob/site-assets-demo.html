<!--
  Source for site-assets-light.gif / site-assets-dark.gif.
  window.seek(ms) sets the frame; ?theme=dark for the dark variant. DURATION is 9600ms.
  Record: playwright-core screenshots at 20fps (600x380, DPR 2), then
  ffmpeg -framerate 20 -i %04d.png -vf "scale=900:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" -loop 0 out.gif
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --ring: #10b981; --btn: #f3f4f6; --btn-text: #374151; --dlg: #ffffff; --dlg-shadow: rgba(0,0,0,.18);
    --bar: #e5e7eb; --danger: #dc2626; --sil: #d1d5db; --sil-bg: #eef0f3; --input: #ffffff; --dash: #d1d5db;
    --badge-bg: #ecfdf5; --badge-text: #047857; --skel: #e5e7eb; --chrome: #f3f4f6;
  }
  html[data-theme="dark"] {
    --bg: #0b0f14; --card: #131920; --border: #232b35; --text: #e5e7eb; --muted: #8b95a5;
    --ring: #34d399; --btn: #1c242e; --btn-text: #d1d5db; --dlg: #1a222c; --dlg-shadow: rgba(0,0,0,.6);
    --bar: #2a3441; --danger: #f87171; --sil: #3a4552; --sil-bg: #1c242e; --input: #0f151c; --dash: #3a4552;
    --badge-bg: #0f2a22; --badge-text: #6ee7b7; --skel: #2a3441; --chrome: #1a222c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 380px; overflow: hidden; background: var(--bg);
    font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #stage { position: relative; width: 600px; height: 380px; }

  /* admin card */
  .card { position: absolute; left: 24px; top: 30px; width: 330px; height: 320px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; }
  .card h1 { position: absolute; left: 24px; top: 20px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .card p.sub { position: absolute; left: 24px; top: 41px; font-size: 12px; color: var(--muted); }
  .label { position: absolute; left: 24px; font-size: 12px; font-weight: 500; }
  .hint { position: absolute; left: 24px; font-size: 11.5px; color: var(--muted); }
  .input { position: absolute; left: 24px; width: 282px; height: 30px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--input); font-size: 12.5px; padding: 0 10px; display: flex; align-items: center; color: var(--text); }
  .input .ph { color: var(--muted); }
  .input .caret { display: inline-block; width: 1px; height: 14px; background: var(--text); margin-left: 1px; opacity: 0; }
  .input.focus { box-shadow: 0 0 0 2px var(--ring); border-color: transparent; }

  .slot { position: absolute; left: 24px; top: 166px; width: 282px; height: 92px; }
  .drop { position: absolute; inset: 0; height: 62px; border: 1.5px dashed var(--dash); border-radius: 10px;
    display: flex; align-items: center; gap: 12px; padding: 0 14px; }
  .drop .t { font-size: 12px; color: var(--muted); }
  .b { font-size: 12.5px; font-weight: 500; color: var(--btn-text); background: var(--btn); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 11px; display: inline-block; white-space: nowrap; }
  .b.primary { background: var(--ring); color: #fff; border-color: transparent; font-weight: 600; }
  .b.press { transform: scale(.96); }
  .prog { position: absolute; left: 0; top: 14px; width: 282px; opacity: 0; }
  .bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ring); border-radius: 3px; }
  .prog .pct { margin-top: 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .done { position: absolute; inset: 0; opacity: 0; }
  .thumb { position: absolute; left: 0; top: 0; width: 140px; height: 80px; border-radius: 9px; overflow: hidden; background: var(--sil-bg);
    box-shadow: 0 0 0 0px var(--ring); }
  .thumb .photo { position: absolute; inset: 0; }
  .thumb .ov { position: absolute; inset: 0; background: rgba(17,24,39,.55); opacity: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 7px; }
  .thumb .ov .bar { width: 96px; background: rgba(255,255,255,.3); }
  .thumb .ov .pct { font-size: 11px; color: #fff; font-variant-numeric: tabular-nums; }
  .done .alt { left: 152px; top: 0; width: 130px; }
  .done .acts { position: absolute; left: 152px; top: 40px; display: flex; gap: 8px; }
  .done .acts .b.primary { min-width: 62px; text-align: center; }

  .url { position: absolute; left: 24px; top: 276px; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); opacity: 0;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .url .chk { width: 14px; height: 14px; border-radius: 50%; background: var(--ring); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .url .chk svg { width: 9px; height: 9px; }
  .url b { color: var(--text); font-weight: 600; }
  .url .badge { font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; font-size: 10.5px; font-weight: 600;
    color: var(--badge-text); background: var(--badge-bg); border-radius: 5px; padding: 2px 6px; }

  /* site preview */
  .site { position: absolute; left: 378px; top: 30px; width: 198px; height: 320px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .site .chrome { height: 30px; background: var(--chrome); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; gap: 5px; }
  .site .chrome i { width: 7px; height: 7px; border-radius: 50%; background: var(--sil); }
  .site .chrome .addr { margin-left: 6px; flex: 1; height: 16px; border-radius: 5px; background: var(--card); border: 1px solid var(--border);
    font-size: 9.5px; color: var(--muted); display: flex; align-items: center; padding: 0 7px; }
  .cover { position: absolute; left: 12px; top: 42px; width: 174px; height: 98px; border-radius: 8px; overflow: hidden; background: var(--sil-bg);
    box-shadow: 0 0 0 0px var(--ring); }
  .cover .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .cover .ph .ico { width: 28px; height: 22px; border: 2px solid var(--sil); border-radius: 4px; position: relative; overflow: hidden; }
  .cover .ph .ico:before { content: ""; position: absolute; left: 5px; top: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--sil); }
  .cover .ph .ico:after { content: ""; position: absolute; left: 2px; bottom: -6px; width: 22px; height: 14px; background: var(--sil); clip-path: polygon(0 100%, 40% 0, 65% 60%, 80% 35%, 100% 100%); }
  .cover .photo { position: absolute; inset: 0; opacity: 0; }
  .site h2 { position: absolute; left: 12px; top: 150px; width: 174px; font-size: 12.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
  .site .line { position: absolute; left: 12px; height: 6px; border-radius: 3px; background: var(--skel); }

  /* photos, css only */
  .photo { position: relative; overflow: hidden; }
  .p1 { background: linear-gradient(180deg, #fde68a 0%, #fb923c 38%, #7c3aed 100%); }
  .p1 .sun { position: absolute; width: 26%; height: 36%; border-radius: 50%; background: #fff7d6; left: 60%; top: 14%; box-shadow: 0 0 16px #fde68a; }
  .p1 .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: linear-gradient(180deg, #4c1d95, #1e1b4b); }
  .p1 .h1 { position: absolute; left: -10%; bottom: 34%; width: 70%; height: 30%; background: #3b1f6e; clip-path: polygon(0 100%, 45% 0, 100% 100%); }
  .p1 .boat { position: absolute; left: 22%; bottom: 14%; width: 22%; height: 8%; background: #1e1b4b; clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%); }
  .p1 .sail { position: absolute; left: 30%; bottom: 22%; width: 9%; height: 26%; background: #fff1f2; clip-path: polygon(0 100%, 0 0, 100% 100%); }
  .p2 { background: linear-gradient(180deg, #bae6fd 0%, #38bdf8 45%, #0c4a6e 100%); }
  .p2 .sun { position: absolute; width: 22%; height: 30%; border-radius: 50%; background: #fefce8; left: 16%; top: 12%; box-shadow: 0 0 14px #fef9c3; }
  .p2 .h1 { position: absolute; left: 30%; bottom: 26%; width: 90%; height: 46%; background: #14532d; clip-path: polygon(0 100%, 45% 0, 100% 100%); }
  .p2 .h2 { position: absolute; left: -20%; bottom: 26%; width: 75%; height: 34%; background: #166534; clip-path: polygon(0 100%, 50% 0, 100% 100%); }
  .p2 .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: linear-gradient(180deg, #0369a1, #0c4a6e); }
  .p2 .light { position: absolute; left: 70%; bottom: 26%; width: 6%; height: 26%; background: #f8fafc; }
  .p2 .light:after { content: ""; position: absolute; left: -30%; top: 0; width: 160%; height: 22%; background: #dc2626; }

  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 26px; transform-origin: 4px 3px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="stage">
  <div class="card">
    <h1>Edit post</h1>
    <p class="sub">Draft, editors only.</p>
    <div class="label" style="top:70px">Title</div>
    <div class="input" style="top:88px">A weekend in the harbour</div>
    <div class="label" style="top:130px">Cover image</div>
    <div class="hint" style="top:147px; left:118px">Images or PDF, up to 25 MB.</div>
    <div class="slot">
      <div class="drop" id="drop"><div class="b" id="choose">Choose file</div><div class="t">or drop it here</div></div>
      <div class="prog" id="prog"><div class="bar"><i id="barfill"></i></div><div class="pct" id="pct">Uploading hero.png, 0%</div></div>
      <div class="done" id="done">
        <div class="thumb" id="thumb">
          <div class="photo p1" id="t1"><div class="sun"></div><div class="h1"></div><div class="sea"></div><div class="boat"></div><div class="sail"></div></div>
          <div class="photo p2" id="t2" style="opacity:0"><div class="sun"></div><div class="h1"></div><div class="h2"></div><div class="sea"></div><div class="light"></div></div>
          <div class="ov" id="ov"><div class="bar"><i id="barfill2"></i></div><div class="pct" id="pct2">0%</div></div>
        </div>
        <div class="input alt" id="alt"><span class="ph" id="altph">Describe this image</span><span id="alttext"></span><span class="caret" id="caret"></span></div>
        <div class="acts"><div class="b primary" id="save">Save</div><div class="b" id="replace">Replace</div></div>
      </div>
    </div>
    <div class="url" id="url1"><span class="chk"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><path d="M1.5 5.5l2.3 2.2L8.5 2.5"/></svg></span><span>media/<b>hero-k3f9a2.png</b></span><span class="badge">immutable</span></div>
    <div class="url" id="url2"><span class="chk"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><path d="M1.5 5.5l2.3 2.2L8.5 2.5"/></svg></span><span>media/<b>hero-7q2xd8.png</b></span><span class="badge">immutable</span></div>
  </div>

  <div class="site">
    <div class="chrome"><i></i><i></i><i></i><div class="addr">site.com/harbour</div></div>
    <div class="cover" id="cover">
      <div class="ph"><div class="ico"></div></div>
      <div class="photo p1" id="c1"><div class="sun"></div><div class="h1"></div><div class="sea"></div><div class="boat"></div><div class="sail"></div></div>
      <div class="photo p2" id="c2"><div class="sun"></div><div class="h1"></div><div class="h2"></div><div class="sea"></div><div class="light"></div></div>
    </div>
    <h2>A weekend in the harbour</h2>
    <div class="line" style="top:194px; width:174px"></div>
    <div class="line" style="top:208px; width:160px"></div>
    <div class="line" style="top:222px; width:170px"></div>
    <div class="line" style="top:236px; width:120px"></div>
    <div class="line" style="top:262px; width:174px"></div>
    <div class="line" style="top:276px; width:150px"></div>
    <div class="line" style="top:290px; width:166px"></div>
  </div>

  <svg id="cursor" viewBox="0 0 22 26"><path d="M3 2 L3 20 L7.6 15.6 L10.8 23 L14 21.6 L10.9 14.4 L17.5 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const $ = id => document.getElementById(id);
  const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
  const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  const easeOut = x => 1 - Math.pow(1-x, 3);
  const seg = (t, a, b, fn=ease) => fn(clamp((t-a)/(b-a)));
  const lerp = (a, b, x) => a + (b-a)*x;
  // click flash: 1 at moment, decays over 220ms
  const click = (t, at) => t < at ? 0 : 1 - clamp((t-at)/220);

  // positions (stage coords, cursor hotspot), measured, never hardcoded
  const c = id => { const r = $(id).getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
  const P = { start:[540,345], rest:[190,332], choose:c('choose'), alt:c('alt'), save:c('save'), replace:c('replace') };
  P.alt = [P.alt[0] - 30, P.alt[1]];
  // cursor path: list of [tFrom, tTo, from, to]
  const path = [
    [500, 1300, P.start, P.choose],
    [1600, 2200, P.choose, P.rest],
    [3500, 4150, P.rest, P.alt],
    [5300, 5850, P.alt, P.save],
    [6300, 6850, P.save, P.replace],
    [7250, 7900, P.replace, P.start],
  ];
  function cursorAt(t) {
    let pos = P.start;
    for (const [a, b, f, to] of path) {
      if (t < a) break;
      const x = seg(t, a, b);
      pos = [lerp(f[0], to[0], x), lerp(f[1], to[1], x)];
    }
    return pos;
  }
  const ALT = 'Harbour at dusk';

  window.seek = function(t) {
    const [cx, cy] = cursorAt(t);
    const press = Math.max(click(t,1350), click(t,4250), click(t,5950), click(t,6950));
    $('cursor').style.transform = `translate(${cx-3}px, ${cy-2}px) scale(${1 - .12*press})`;

    // beat 1: choose file
    $('choose').className = 'b' + (click(t, 1350) > .3 ? ' press' : '');
    const dropOut = seg(t, 1400, 1600);
    $('drop').style.opacity = 1 - dropOut;

    // beat 2: first upload in flight
    const up = seg(t, 1600, 3000);
    const progVis = seg(t, 1500, 1650) * (1 - seg(t, 3050, 3250));
    $('prog').style.opacity = progVis;
    $('barfill').style.width = (up*100) + '%';
    $('pct').textContent = `Uploading hero.png, ${Math.round(up*100)}%`;

    // beat 3: done, thumbnail + alt + save, path row, site preview updates
    const doneIn = seg(t, 3200, 3450, easeOut);
    $('done').style.opacity = doneIn;
    const url1In = seg(t, 3400, 3650), url1Out = seg(t, 8150, 8400);
    $('url1').style.opacity = url1In * (1 - url1Out);
    const c1In = seg(t, 3500, 3800);
    $('c1').style.opacity = c1In;
    const flash1 = t < 3500 ? 0 : 1 - clamp((t-3500)/600);
    const flash2 = t < 8200 ? 0 : 1 - clamp((t-8200)/600);
    $('cover').style.boxShadow = `0 0 0 ${3*Math.max(flash1, flash2)}px var(--ring)`;

    // beat 4: alt text, then save
    const focus = t >= 4200 && t < 5950;
    $('alt').className = 'input alt' + (focus ? ' focus' : '');
    const n = Math.round(clamp((t-4350)/850) * ALT.length);
    $('alttext').textContent = ALT.slice(0, n);
    $('altph').style.display = n > 0 ? 'none' : 'inline';
    $('caret').style.opacity = focus && Math.floor(t/500) % 2 === 0 ? 1 : 0;
    const saved = t >= 6100;
    $('save').textContent = saved ? 'Saved' : 'Save';
    $('save').className = 'b primary' + (click(t, 5950) > .3 ? ' press' : '');

    // beat 5: replace, new path, preview swaps, old object untouched
    $('replace').className = 'b' + (click(t, 6950) > .3 ? ' press' : '');
    const up2 = seg(t, 7200, 8000);
    const ovVis = seg(t, 7050, 7250) * (1 - seg(t, 8050, 8250));
    $('ov').style.opacity = ovVis;
    $('barfill2').style.width = (up2*100) + '%';
    $('pct2').textContent = Math.round(up2*100) + '%';
    const swap = seg(t, 8100, 8400);
    $('t2').style.opacity = swap;
    $('c2').style.opacity = seg(t, 8200, 8500);
    $('url2').style.opacity = seg(t, 8250, 8500);
  };
  window.DURATION = 9600;
  seek(0);
</script>
</body>
</html>
