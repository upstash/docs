<!--
  Source for private-documents-light.gif / private-documents-dark.gif.
  window.seek(ms) sets the frame; ?theme=dark for the dark variant. DURATION is 9400ms.
  Record: playwright-core screenshots at 20fps (600x380, DPR 2), then
  ffmpeg -framerate 20 -i %04d.png -vf "scale=900:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" -loop 0 out.gif
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --ring: #10b981; --btn: #f3f4f6; --btn-text: #374151; --dlg: #ffffff; --dlg-shadow: rgba(0,0,0,.18);
    --bar: #e5e7eb; --danger: #dc2626; --sil: #d1d5db; --sil-bg: #eef0f3; --pill: #ecfdf5; --pill-text: #047857;
  }
  html[data-theme="dark"] {
    --bg: #0b0f14; --card: #131920; --border: #232b35; --text: #e5e7eb; --muted: #8b95a5;
    --ring: #34d399; --btn: #1c242e; --btn-text: #d1d5db; --dlg: #1a222c; --dlg-shadow: rgba(0,0,0,.6);
    --bar: #2a3441; --danger: #f87171; --sil: #3a4552; --sil-bg: #1c242e; --pill: #0f2a22; --pill-text: #6ee7b7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 380px; overflow: hidden; background: var(--bg);
    font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #stage { position: relative; width: 600px; height: 380px; }
  .card { position: absolute; left: 100px; top: 70px; width: 400px; height: 240px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 22px 28px; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; }
  .card h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .card p.sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .btn { font-size: 12.5px; font-weight: 500; color: var(--btn-text); background: var(--btn); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 11px; display: inline-block; white-space: nowrap; }
  .btn.press { transform: scale(.96); }

  .list { margin-top: 16px; }
  .row { position: relative; display: flex; align-items: center; height: 34px; padding: 0 8px; margin: 0 -8px; border-radius: 8px; gap: 10px; }
  .row .fi { flex: none; width: 13px; height: 16px; border: 1.5px solid var(--muted); border-radius: 2px; position: relative; opacity: .85; }
  .row .fi::after { content: ""; position: absolute; left: 2.5px; right: 2.5px; top: 5px; height: 6px;
    background: repeating-linear-gradient(180deg, var(--muted) 0 1.2px, transparent 1.2px 3px); opacity: .7; }
  .row .name { font-size: 13px; font-weight: 500; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
  .row.hot .name { text-decoration-color: var(--muted); }
  .row.on { background: var(--btn); }
  .row .right { margin-left: auto; position: relative; height: 20px; width: 150px; }
  .row .right > * { position: absolute; right: 0; top: 0; height: 20px; display: flex; align-items: center; white-space: nowrap; }
  .row .size { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .chk { font-size: 11.5px; color: var(--muted); gap: 6px; opacity: 0; }
  .row .chk i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .row .pill { font-size: 11px; font-weight: 600; color: var(--pill-text); background: var(--pill); border-radius: 999px; padding: 0 8px 0 6px; gap: 5px; opacity: 0; }
  .row .pill svg { width: 10px; height: 11px; }
  .row .bar { width: 100px; height: 6px; top: 7px; right: 38px; border-radius: 3px; background: var(--bar); overflow: hidden; opacity: 0; }
  .row .bar i { display: block; height: 100%; width: 0; background: var(--ring); border-radius: 3px; }
  .row .pct { right: 0; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; opacity: 0; }

  .status { position: absolute; left: 28px; bottom: 20px; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); opacity: 0;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .status .ok { width: 14px; height: 14px; border-radius: 50%; background: var(--ring); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .status .ok svg { width: 9px; height: 9px; }
  .status b { color: var(--text); font-weight: 600; }

  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 26px; transform-origin: 4px 3px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="stage">
  <div class="card">
    <div class="head">
      <div>
        <h1>Documents</h1>
        <p class="sub">Private. Only you can download these.</p>
      </div>
      <div class="btn" id="upload">Upload PDF</div>
    </div>
    <div class="list">
      <div class="row" id="r1">
        <div class="fi"></div><span class="name" id="n1">Invoice 1042.pdf</span>
        <div class="right">
          <span class="size" id="s1">48 KB</span>
          <span class="chk" id="chk"><i></i>checking owner</span>
          <span class="pill" id="pill"><svg viewBox="0 0 10 11" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="4.5" width="7" height="5.5" rx="1.2" fill="currentColor" stroke="none"/><path d="M3 4.5V3a2 2 0 0 1 4 0v1.5"/></svg>signed link, expires in 2m</span>
        </div>
      </div>
      <div class="row" id="r2">
        <div class="fi"></div><span class="name">Contract.pdf</span>
        <div class="right"><span class="size">1.3 MB</span></div>
      </div>
      <div class="row" id="r3">
        <div class="fi" id="fi3"></div><span class="name" id="n3">Report.pdf</span>
        <div class="right">
          <span class="bar" id="bar"><i id="barfill"></i></span>
          <span class="pct" id="pct">0%</span>
          <span class="size" id="s3">2.1 MB</span>
        </div>
      </div>
    </div>
    <div class="status" id="st1"><span class="ok"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><path d="M1.5 5.5l2.3 2.2L8.5 2.5"/></svg></span><span>Uploaded <b>Report.pdf</b></span></div>
    <div class="status" id="st2"><span class="ok"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><path d="M1.5 5.5l2.3 2.2L8.5 2.5"/></svg></span><span>Downloading <b>Invoice 1042.pdf</b></span></div>
  </div>

  <svg id="cursor" viewBox="0 0 22 26"><path d="M3 2 L3 20 L7.6 15.6 L10.8 23 L14 21.6 L10.9 14.4 L17.5 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const $ = id => document.getElementById(id);
  const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
  const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  const easeOut = x => 1 - Math.pow(1-x, 3);
  const seg = (t, a, b, fn=ease) => fn(clamp((t-a)/(b-a)));
  const lerp = (a, b, x) => a + (b-a)*x;
  // click flash: 1 at moment, decays over 220ms
  const click = (t, at) => t < at ? 0 : 1 - clamp((t-at)/220);

  // positions (stage coords, cursor hotspot)
  const c = id => { const r = $(id).getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
  // aim at the lower left of the link so the arrow body does not cover the name
  const n1r = $('n1').getBoundingClientRect();
  const P = { start:[470,340], upload:c('upload'), n1:[n1r.left + 6, n1r.top + n1r.height*.72] };
  // cursor path: list of [tFrom, tTo, from, to]
  const path = [
    [500, 1300, P.start, P.upload],
    [4400, 5200, P.upload, P.n1],
  ];
  function cursorAt(t) {
    let pos = P.start;
    for (const [a, b, f, to] of path) {
      if (t < a) break;
      const x = seg(t, a, b);
      pos = [lerp(f[0], to[0], x), lerp(f[1], to[1], x)];
    }
    return pos;
  }

  const T = {
    up: 1350,                 // click Upload PDF
    barIn: 1450, upA: 1550, upB: 3200, barOut: 3350,
    rowIn: 3300, stIn: 3450,
    open: 5250,               // click Invoice 1042.pdf
    chkIn: 5450, chkOut: 6300, pillIn: 6350, st2In: 6550,
  };

  window.seek = function(t) {
    const [cx, cy] = cursorAt(t);
    const press = Math.max(click(t, T.up), click(t, T.open));
    $('cursor').style.transform = `translate(${cx-3}px, ${cy-2}px) scale(${1 - .12*press})`;

    // upload button
    $('upload').className = 'btn' + (click(t, T.up) > .3 ? ' press' : '');

    // beat 1: progress in row 3 (the picker's <progress>)
    const up = seg(t, T.upA, T.upB);
    const barVis = seg(t, T.barIn, T.barIn + 150) * (1 - seg(t, T.barOut, T.barOut + 200));
    $('bar').style.opacity = barVis; $('pct').style.opacity = barVis;
    $('barfill').style.width = (up*100) + '%';
    $('pct').textContent = Math.round(up*100) + '%';
    // row 3 name and icon: faint while in flight, solid once the row exists
    const rowIn = seg(t, T.rowIn, T.rowIn + 300);
    const pre = seg(t, T.barIn, T.barIn + 150);
    $('n3').style.opacity = lerp(0, lerp(.45, 1, rowIn), pre);
    $('fi3').style.opacity = lerp(0, lerp(.35, .85, rowIn), pre);
    $('s3').style.opacity = rowIn;

    // beat 2: uploaded status, later replaced by the download status
    const st1 = seg(t, T.stIn, T.stIn + 300) * (1 - seg(t, T.open - 100, T.open + 150));
    $('st1').style.opacity = st1;

    // beat 3: open a document through the route
    const hot = t >= T.open - 200 && t < T.open + 1400;
    const on = t >= T.open;
    $('r1').className = 'row' + (hot ? ' hot' : '') + (on ? ' on' : '');
    const chk = seg(t, T.chkIn, T.chkIn + 200) * (1 - seg(t, T.chkOut, T.chkOut + 150));
    $('s1').style.opacity = 1 - seg(t, T.open, T.open + 150);
    $('chk').style.opacity = chk;
    // checking dot pulses
    const pulse = .5 + .5 * Math.sin((t - T.chkIn) / 140);
    $('chk').firstElementChild.style.opacity = lerp(.35, 1, pulse);
    const pillIn = seg(t, T.pillIn, T.pillIn + 300, easeOut);
    $('pill').style.opacity = pillIn;
    $('pill').style.transform = `translateY(${lerp(3, 0, pillIn)}px)`;
    $('st2').style.opacity = seg(t, T.st2In, T.st2In + 300);
  };
  window.DURATION = 9400;
  seek(0);
</script>
</body>
</html>
