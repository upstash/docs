<!--
  Source for exports-light.gif / exports-dark.gif.
  window.seek(ms) sets the frame; ?theme=dark for the dark variant. DURATION is 9500ms.
  Record: playwright-core screenshots at 20fps (600x380, DPR 2), then
  ffmpeg -framerate 20 -i %04d.png -vf "scale=900:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" -loop 0 out.gif
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --ring: #10b981; --btn: #f3f4f6; --btn-text: #374151; --dlg: #ffffff; --dlg-shadow: rgba(0,0,0,.18);
    --bar: #e5e7eb; --danger: #dc2626; --sil: #d1d5db; --sil-bg: #eef0f3;
  }
  html[data-theme="dark"] {
    --bg: #0b0f14; --card: #131920; --border: #232b35; --text: #e5e7eb; --muted: #8b95a5;
    --ring: #34d399; --btn: #1c242e; --btn-text: #d1d5db; --dlg: #1a222c; --dlg-shadow: rgba(0,0,0,.6);
    --bar: #2a3441; --danger: #f87171; --sil: #3a4552; --sil-bg: #1c242e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 380px; overflow: hidden; background: var(--bg);
    font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #stage { position: relative; width: 600px; height: 380px; }
  .card { position: absolute; left: 100px; top: 70px; width: 400px; height: 240px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 26px 28px; }
  .card h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .card p.sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .later { position: absolute; right: 24px; top: 24px; font-size: 11px; font-weight: 500; color: var(--muted);
    background: var(--btn); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; opacity: 0; }

  .row { display: flex; align-items: flex-start; gap: 18px; margin-top: 26px; height: 40px; }
  .b { font-size: 12.5px; padding: 7px 14px; border-radius: 8px; background: var(--btn); color: var(--btn-text); border: 1px solid var(--border);
    display: inline-block; flex: none; }
  .b.primary { background: var(--ring); color: #fff; border-color: transparent; font-weight: 600; }
  .b.press { transform: scale(.96); }
  .status { position: relative; flex: 1; height: 40px; }
  .pending { position: absolute; left: 0; top: 7px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); opacity: 0; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bar); border-top-color: var(--ring); flex: none; }
  .ready { position: absolute; left: 0; top: 0; opacity: 0; }
  .dl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ring); padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
  .dl svg { width: 13px; height: 13px; }
  .dl.press { transform: scale(.97); }
  .dl.dead { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .hint.dead { color: var(--danger); }

  .chip { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; padding: 7px 11px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); opacity: 0; white-space: nowrap; }
  .doc { position: relative; width: 20px; height: 26px; background: var(--sil-bg); border: 1px solid var(--sil); border-radius: 3px; flex: none; overflow: hidden; }
  .doc i { position: absolute; left: 4px; right: 4px; height: 2px; background: var(--sil); border-radius: 1px; }
  .doc i:nth-child(1) { top: 8px; } .doc i:nth-child(2) { top: 13px; } .doc i:nth-child(3) { top: 18px; right: 9px; }
  .chip .name { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
  .chip .sub2 { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .url { position: absolute; left: 28px; bottom: 22px; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); opacity: 0;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .url .chk { width: 14px; height: 14px; border-radius: 50%; background: var(--ring); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .url .chk svg { width: 9px; height: 9px; }
  .url b { color: var(--text); font-weight: 600; }
  .url.dead .chk { background: var(--sil); }
  .url.dead .path { text-decoration: line-through; }
  .url.dead b { color: var(--muted); font-weight: 500; }
  .url .swept { font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; font-size: 11px; opacity: 0; }

  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 26px; transform-origin: 4px 3px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="stage">
  <div class="card">
    <h1>Reports</h1>
    <p class="sub">Export every order as a CSV.</p>
    <div class="later" id="later">24 hours later</div>
    <div class="row">
      <div class="b primary" id="export">Export</div>
      <div class="status">
        <div class="pending" id="pending"><span class="spin" id="spin"></span><span id="ptext">Building your export...</span></div>
        <div class="ready" id="ready">
          <div class="dl" id="dl"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7M4 6.5L7 9.5l3-3M2.5 12h9"/></svg><span>Download CSV</span></div>
          <div class="hint" id="hint">Ready. The link stops working in 24 hours.</div>
        </div>
      </div>
    </div>
    <div class="chip" id="chip">
      <div class="doc"><i></i><i></i><i></i></div>
      <div><div class="name">export-3fa9.csv</div><div class="sub2" id="chipsub">Saved. The signed URL lasts 5 min.</div></div>
    </div>
    <div class="url" id="url"><span class="chk"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><path d="M1.5 5.5l2.3 2.2L8.5 2.5"/></svg></span><span class="path">exports/<b>u_42</b>/3fa9.csv</span><span class="swept" id="swept">deleted by the cron</span></div>
  </div>

  <svg id="cursor" viewBox="0 0 22 26"><path d="M3 2 L3 20 L7.6 15.6 L10.8 23 L14 21.6 L10.9 14.4 L17.5 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const $ = id => document.getElementById(id);
  const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
  const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  const easeOut = x => 1 - Math.pow(1-x, 3);
  const seg = (t, a, b, fn=ease) => fn(clamp((t-a)/(b-a)));
  const lerp = (a, b, x) => a + (b-a)*x;
  // click flash: 1 at moment, decays over 220ms
  const click = (t, at) => t < at ? 0 : 1 - clamp((t-at)/220);

  // positions (stage coords, cursor hotspot)
  const c = id => { const r = $(id).getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
  const P = { start:[470,330], export:c('export'), dl:c('dl'), rest:[440,345] };
  // cursor path: list of [tFrom, tTo, from, to]
  const path = [
    [600, 1400, P.start, P.export],
    [5300, 6000, P.export, P.dl],
    [6500, 7200, P.dl, P.rest],
  ];
  function cursorAt(t) {
    let pos = P.start;
    for (const [a, b, f, to] of path) {
      if (t < a) break;
      const x = seg(t, a, b);
      pos = [lerp(f[0], to[0], x), lerp(f[1], to[1], x)];
    }
    return pos;
  }

  // beats: 1500 click Export, 1600-4400 pending, 4600 ready + path, 6100 click Download, 6300 chip, 7400 expiry
  window.seek = function(t) {
    const [cx, cy] = cursorAt(t);
    const press = Math.max(click(t,1500), click(t,6100));
    $('cursor').style.transform = `translate(${cx-3}px, ${cy-2}px) scale(${1 - .12*press})`;

    // export button: pressed, then disabled while pending
    const busy = t >= 1500 && t < 4600;
    $('export').className = 'b primary' + (click(t, 1500) > .3 ? ' press' : '');
    $('export').style.opacity = busy ? .5 : 1;

    // pending state with spinner
    const pIn = seg(t, 1550, 1800), pOut = seg(t, 4350, 4550);
    $('pending').style.opacity = pIn * (1 - pOut);
    $('spin').style.transform = `rotate(${(t / 900 * 360) % 360}deg)`;

    // object stored, then row flips to ready
    const urlIn = seg(t, 4450, 4750);
    $('url').style.opacity = urlIn;
    const rIn = seg(t, 4650, 4950, easeOut);
    $('ready').style.opacity = rIn;
    $('ready').style.transform = `translateY(${lerp(4, 0, rIn)}px)`;

    // download click and the saved file
    const dead = t >= 7500;
    $('dl').className = 'dl' + (click(t, 6100) > .3 ? ' press' : '') + (dead ? ' dead' : '');
    const cIn = seg(t, 6250, 6600, easeOut);
    $('chip').style.opacity = cIn;
    $('chip').style.transform = `translateY(${lerp(6, 0, cIn)}px)`;

    // a day later: the row expired, the cron swept the object
    const lIn = seg(t, 7300, 7600);
    $('later').style.opacity = lIn;
    $('hint').className = 'hint' + (dead ? ' dead' : '');
    $('hint').textContent = dead ? 'Export expired.' : 'Ready. The link stops working in 24 hours.';
    $('url').className = 'url' + (dead ? ' dead' : '');
    $('swept').style.opacity = seg(t, 7600, 7900);
  };
  window.DURATION = 9500;
  seek(0);
</script>
</body>
</html>
